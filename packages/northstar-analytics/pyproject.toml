[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "northstar-analytics"
version = "0.1.0"
description = "Analysis helpers, KPI implementations and curriculum support for NorthStar datasets"
requires-python = ">=3.13"
license = { text = "MIT" }

dependencies = [
    "pandas>=2.3,<3",
    "numpy>=1.26,<3",
    "duckdb>=1.1",
    "pyarrow>=17",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/northstar_analytics"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "northstar-fetch"
version = "0.1.0"
description = "External resource and market data acquisition for the NorthStar PV simulator"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

dependencies = [
    "pandas>=2.3,<3",
    "numpy>=1.26,<3",
    "pyarrow>=17",
    "requests>=2.32",
    "pydantic>=2.7",
    "pvlib==0.15.2",
]

[project.scripts]
northstar-fetch = "northstar_fetch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/northstar_fetch"]
